# Build du PropBuilder Viewer DESKTOP (Windows).
#
# Différent de bundle-player.yml (qui bake un project.json par app) : ici on
# construit l'app Tauri GÉNÉRIQUE en mode Viewer (VITE_VIEWER_MODE=true →
# launcher, cf. player/src/App.tsx). Aucun slug/projet en entrée. Le binaire
# est uploadé dans <DATA_DIR>/_viewer/ (servi par /api/public/viewer/download/:os),
# PAS dans /var/www/propbuilder que deploy.sh rsync --delete écraserait.
#
# Déclenché à la main (workflow_dispatch). Sortie légère : exe portable
# (--no-bundle). Dépendance runtime : WebView2 (préinstallé Win10/11).
name: Bundle Viewer (desktop)

run-name: "Bundle Viewer desktop (Windows)"

on:
  workflow_dispatch:

env:
  VPS_HOST: 217.182.60.238
  VPS_USER: noxel
  DATA_DIR: /var/www/propbuilder-data
  VITE_VIEWER_MODE: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # Windows — exe portable
  # ---------------------------------------------------------------------------
  windows:
    name: Windows EXE (Viewer)
    runs-on: windows-latest
    steps:
      # On build le player MODERNE (DOM) du repo principal PRIVÉ, pas le
      # player Konva de ce repo : rendu net identique au Mac/navigateur.
      # propbuilder-player reste public (minutes Actions illimitées) ; le
      # checkout du repo privé se fait via un PAT fine-grained (Contents:Read
      # sur Noxeler/PropBuilder) stocké en secret MAIN_REPO_PAT.
      - name: Checkout main repo (DOM player)
        uses: actions/checkout@v4
        with:
          repository: Noxeler/PropBuilder
          token: ${{ secrets.MAIN_REPO_PAT }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: player/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: player/src-tauri

      # Le player principal partage du code avec l'app (player/src importe
      # ../../src/utils/*) → son tsc compile aussi des fichiers racine dont
      # les deps (gifuct-js…) vivent dans le node_modules RACINE. Sans ce
      # npm ci racine, le build échoue (TS2307 gifuct-js).
      # --ignore-scripts : le postinstall racine (copie ffmpeg via mkdir -p/cp -f)
      # est en syntaxe Unix et casse sur le runner Windows. On n'a besoin que des
      # node_modules pour résoudre gifuct-js au tsc du player, pas des assets ffmpeg.
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install Player dependencies
        working-directory: player
        run: npm ci

      # Icône PropBuilder Viewer (Play outline, identique aux Viewers iOS/
      # Android/Mac) — tauri icon génère icon.ico / icon.png / pngs dans
      # src-tauri/icons/ depuis le 1024×1024. Autonome (pas d'imagemagick).
      - name: Generate Viewer icons
        working-directory: player
        run: npm run tauri -- icon src-tauri/viewer-icon.png

      # tauri icon produit un icon.ico dont les grandes tailles sont en PNG,
      # qui s'embarque mal dans l'.exe Windows (winres) → icône absente dans
      # l'Explorer. On régénère donc l'.ico avec ImageMagick (format multi-BMP
      # classique), exactement comme les builds par-app (bundle-player.yml),
      # dont l'icône .exe fonctionne. magick est préinstallé sur windows-latest.
      - name: Force Windows .ico (ImageMagick, comme les builds par-app)
        working-directory: player/src-tauri
        shell: bash
        run: magick viewer-icon.png -define icon:auto-resize=256,128,64,32,16 icons/icon.ico

      - name: Patch tauri.conf.json for the Viewer
        working-directory: player/src-tauri
        shell: bash
        run: |
          jq '.productName = "PropBuilder Viewer"
              | .identifier = "com.noxel.propbuilder.viewer"
              | .app.windows[0].title = "PropBuilder Viewer"
              | .app.windows[0].width = 1100
              | .app.windows[0].height = 750
              | .app.windows[0].resizable = true
              | .app.windows[0].fullscreen = false' \
            tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json

      # Le rust-cache restaure un target/ où build.rs du crate `player` a déjà
      # tourné → cargo ne ré-exécute pas l'embed de l'icône Windows (winres),
      # donc l'.exe garde l'icône du tout premier build (l'.ico PNG de
      # `tauri icon`, qui s'affiche « par défaut »). On nettoie le crate player
      # (pas les deps) pour forcer build.rs à ré-embarquer l'.ico ImageMagick.
      - name: Force icon re-embed (clean player crate, keep deps cached)
        working-directory: player/src-tauri
        shell: bash
        run: cargo clean --release -p player

      - name: Build EXE (portable, viewer mode, unsigned)
        working-directory: player
        run: npm run tauri build -- --no-bundle

      - name: Locate EXE
        id: find_exe
        shell: bash
        run: |
          EXE=$(find player/src-tauri/target/release -maxdepth 1 -name "*.exe" | head -1)
          if [ -z "$EXE" ]; then
            echo "No portable exe produced"
            find player/src-tauri/target -name "*.exe" -maxdepth 4 || true
            exit 1
          fi
          echo "Found EXE: $EXE ($(du -h "$EXE" | cut -f1))"
          echo "path=$EXE" >> "$GITHUB_OUTPUT"

      - name: Set up SSH to VPS
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload EXE to VPS
        shell: bash
        env:
          EXE_PATH: ${{ steps.find_exe.outputs.path }}
        run: |
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "mkdir -p ${{ env.DATA_DIR }}/_viewer && rm -f ${{ env.DATA_DIR }}/_viewer/PropBuilderViewer-windows.exe"
          scp "${EXE_PATH}" "${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.DATA_DIR }}/_viewer/PropBuilderViewer-windows.exe"
